<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>global-music</title>
    <script>
      window.onerror = function(message, source, lineno, colno, error) {
        document.body.innerHTML = '<div style="color:white;background:red;padding:20px;z-index:9999;position:absolute;top:0;left:0;right:0;"><h1>Global Error</h1><pre>' + message + '</pre><pre>' + (error && error.stack ? error.stack : '') + '</pre></div>';
      };
      window.addEventListener("unhandledrejection", function(event) {
        document.body.innerHTML = '<div style="color:white;background:red;padding:20px;z-index:9999;position:absolute;top:0;left:0;right:0;"><h1>Unhandled Promise Rejection</h1><pre>' + (event.reason && event.reason.stack ? event.reason.stack : event.reason) + '</pre></div>';
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
